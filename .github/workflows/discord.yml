name: Notify Discord on Pull Request

on:
  pull_request:
    types:
      - ready_for_review

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send message to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          ACTOR="${{ github.event.pull_request.user.login }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          TIMESTAMP="${{ github.event.pull_request.created_at }}"

          EPOCH=$(date -d "$TIMESTAMP" +%s)

          # -----------------------------
          # PR Description
          # -----------------------------

          if [ -n "$PR_BODY" ] && [ "$PR_BODY" != "null" ]; then
            DESCRIPTION=$(echo "$PR_BODY" \
              | head -20 \
              | head -c 1000)
          else
            DESCRIPTION="No pull request description."
          fi


          # -----------------------------
          # Wait for CI
          # -----------------------------

          CI_WORKFLOW="ci"
          CI_STATUS="unknown"

          echo "Waiting for CI workflow..."

          for i in {1..30}
          do
            RUN_DATA=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${COMMIT_SHA}")

            STATUS=$(echo "$RUN_DATA" \
              | jq -r \
              --arg workflow "$CI_WORKFLOW" \
              '.workflow_runs[]
              | select(.name | ascii_downcase | contains($workflow))
              | .status' \
              | head -1)

            CONCLUSION=$(echo "$RUN_DATA" \
              | jq -r \
              --arg workflow "$CI_WORKFLOW" \
              '.workflow_runs[]
              | select(.name | ascii_downcase | contains($workflow))
              | .conclusion' \
              | head -1)

            if [ "$STATUS" = "completed" ]; then

              case "$CONCLUSION" in
                success)
                  CI_STATUS="✅ Passed"
                  ;;
                failure)
                  CI_STATUS="❌ Failed"
                  ;;
                cancelled)
                  CI_STATUS="⚠️ Cancelled"
                  ;;
                *)
                  CI_STATUS="❓ $CONCLUSION"
                  ;;
              esac

              break
            fi

            sleep 10
          done


          if [ "$CI_STATUS" = "unknown" ]; then
            CI_STATUS="⏳ Timeout / No CI found"
          fi


          # -----------------------------
          # Changed files
          # -----------------------------

          CHANGED_FILES=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" \
            | jq -r '.[].filename' \
            | head -15)

          if [ -n "$CHANGED_FILES" ]; then
            FILE_LIST=$(echo "$CHANGED_FILES" \
              | awk '{print "• `" $0 "`"}')
          else
            FILE_LIST="• \`no file info\`"
          fi


          # -----------------------------
          # Discord payload
          # -----------------------------

          PAYLOAD=$(jq -n \
            --arg actor "$ACTOR" \
            --arg pr_number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg description "$DESCRIPTION" \
            --arg ci "$CI_STATUS" \
            --arg link "$PR_URL" \
            --arg file_list "$FILE_LIST" \
            --argjson epoch "$EPOCH" \
            '
            {
              content:"",
              embeds:[
                {
                  title:("🔔 New Pull Request #"+$pr_number),
                  url:$link,
                  color:5814783,

                  fields:[
                    {
                      name:"👤 Author",
                      value:$actor,
                      inline:true
                    },
                    {
                      name:"🕐 Time",
                      value:("<t:"+($epoch|tostring)+":R>"),
                      inline:true
                    },
                    {
                      name:"📝 Title",
                      value:("```"+$title+"```"),
                      inline:false
                    },
                    {
                      name:"📖 Extended Description",
                      value:("```"+$description+"```"),
                      inline:false
                    },
                    {
                      name:"🟢 CI Status",
                      value:$ci,
                      inline:false
                    },
                    {
                      name:"📂 Changed Files",
                      value:$file_list,
                      inline:false
                    }
                  ],

                  footer:{
                    text:"transcendence"
                  }
                }
              ]
            }
            ')


          curl -f \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"


