services:
  postgres:
    image: postgres:17-alpine
    container_name: transcendence-postgres

    environment:
      POSTGRES_USER: transcendence
      POSTGRES_PASSWORD: transcendence
      POSTGRES_DB: transcendence

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U transcendence -d transcendence']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev

    environment:
      DATABASE_URL: postgresql://transcendence:transcendence@postgres:5432/transcendence

    command: >
      sh -c "
        pnpm --dir apps/api exec prisma generate &&
        pnpm --dir apps/api exec prisma migrate deploy
      "

    depends_on:
      postgres:
        condition: service_healthy

    restart: 'no'

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev

    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://transcendence:transcendence@postgres:5432/transcendence
      JWT_SECRET: development-secret
      WEB_ORIGIN: https://localhost
      GENERATE_PRISMA: "true"
      GOOGLE_CALLBACK_URL: https://localhost/api/auth/google/callback

    command:
      - /app/docker/dev-entrypoint.sh
      - pnpm
      - --filter
      - api
      - dev

    ports:
      - '3000:3000'
  
    depends_on:
      migrate:
        condition: service_completed_successfully

    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - upload_data:/app/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
  
    command:
      - /app/docker/dev-entrypoint.sh
      - pnpm
      - --filter
      - web
      - exec
      - vite
      - --host
      - 0.0.0.0
  
    ports:
      - '5173:5173'

    depends_on:
      - api
 
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules

  nginx:
    image: nginx:1.27-alpine
    container_name: transcendence-nginx

    ports:
      - '80:80'
      - '443:443'

    depends_on:
      - web
      - api

    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
  upload_data:
