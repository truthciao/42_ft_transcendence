services:
  postgres:
    image: postgres:17-alpine
    container_name: transcendence-postgres

    environment:
      POSTGRES_USER: transcendence
      POSTGRES_PASSWORD: transcendence
      POSTGRES_DB: transcendence

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U transcendence -d transcendence']
      interval: 5s
      timeout: 5s
      retries: 10


  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev

    environment:
      DATABASE_URL: postgresql://transcendence:transcendence@postgres:5432/transcendence

    # 先由 dev-entrypoint 同步 workspace dependencies，
    # 再执行 Prisma generate + migrate。
    command:
      - /app/docker/dev-entrypoint.sh
      - sh
      - -c
      - |
        pnpm --dir apps/api exec prisma generate &&
        pnpm --dir apps/api exec prisma migrate deploy

    depends_on:
      postgres:
        condition: service_healthy

    restart: 'no'

    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules


  api:
    build:
      context: .
      dockerfile: Dockerfile.dev

    # 不要指定 user。
    # Docker / rootless Podman 使用各自默认的容器用户映射。

    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      WEB_ORIGIN: ${WEB_ORIGIN}

      NODE_ENV: development
      PORT: 3000

      DATABASE_URL: postgresql://transcendence:transcendence@postgres:5432/transcendence

      JWT_SECRET: ${JWT_SECRET}
      GENERATE_PRISMA: 'true'

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_SECURE: ${MAIL_SECURE}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}

      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}

    command:
      - /app/docker/dev-entrypoint.sh
      - pnpm
      - --filter
      - api
      - dev

    depends_on:
      migrate:
        condition: service_completed_successfully

    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - upload_data:/app/apps/api/uploads


  web:
    build:
      context: .
      dockerfile: Dockerfile.dev

    # 同样不要指定 user。

    command:
      - /app/docker/dev-entrypoint.sh
      - pnpm
      - --filter
      - web
      - exec
      - vite
      - --host
      - 0.0.0.0

    ports:
      - '5173:5173'

    depends_on:
      api:
        condition: service_started

    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules


  nginx:
    image: nginx:1.27-alpine
    container_name: transcendence-nginx

    ports:
      - '8080:80'
      - '8443:443'

    depends_on:
      - web
      - api

    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro


volumes:
  postgres_data:
  upload_data:

  # pnpm workspace dependencies
  root_node_modules:
  api_node_modules:
  web_node_modules: