name: Notify Discord on main updates and PR open

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send message to Discord
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          UPDATED_AT: ${{ github.event.pull_request.updated_at || github.event.head_commit.timestamp }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
          PUSH_URL: ${{ github.event.head_commit.url }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            TITLE="$PR_TITLE"
            LINK="$PR_URL"
            DESCRIPTION="${PR_BODY:-No pull request description.}"
            if [ -n "$PR_BODY" ]; then
              DESCRIPTION=$(printf '%s' "$PR_BODY" | head -20 | head -c 1000)
            else
              DESCRIPTION="No pull request description."
            fi
            EMBED_TITLE="🔔 New Pull Request"
          else
            PR_DATA=$(curl -s \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/commits/$HEAD_SHA/pulls")

            API_TITLE=$(echo "$PR_DATA" | jq -r '.[0].title // empty')
            API_BODY=$(echo "$PR_DATA" | jq -r '.[0].body // ""')
            API_URL=$(echo "$PR_DATA" | jq -r '.[0].html_url // empty')

            if [ -n "$API_TITLE" ]; then
              TITLE="$API_TITLE"
              LINK="$API_URL"
              DESCRIPTION="$API_BODY"
            else
              TITLE=$(printf '%s' "$PUSH_MESSAGE" | head -1)
              LINK="$PUSH_URL"
              DESCRIPTION="No pull request description."
            fi

            if [ -n "$DESCRIPTION" ] && [ "$DESCRIPTION" != "No pull request description." ]; then
              DESCRIPTION=$(printf '%s' "$DESCRIPTION" | head -20 | head -c 1000)
            fi

            EMBED_TITLE="🚀 Main updated"
          fi

          EPOCH=$(date -d "$UPDATED_AT" +%s)

          CI_STATUS="⏳ Waiting for CI..."
          RUN_DATA=$(curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs?head_sha=$HEAD_SHA")

          STATUS=$(echo "$RUN_DATA" | jq -r --arg workflow "ci" '.workflow_runs[] | select(.name | ascii_downcase | contains($workflow)) | .status' | head -1)
          CONCLUSION=$(echo "$RUN_DATA" | jq -r --arg workflow "ci" '.workflow_runs[] | select(.name | ascii_downcase | contains($workflow)) | .conclusion' | head -1)

          if [ "$STATUS" = "completed" ]; then
            case "$CONCLUSION" in
              success)
                CI_STATUS="✅ Passed"
                ;;
              failure)
                CI_STATUS="❌ Failed"
                ;;
              cancelled)
                CI_STATUS="⚠️ Cancelled"
                ;;
              *)
                CI_STATUS="❓ $CONCLUSION"
                ;;
            esac
          fi

          CHANGED_FILES=$(curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" \
            | jq -r '.files[].filename' \
            | head -15)

          if [ -n "$CHANGED_FILES" ]; then
            FILE_LIST=$(echo "$CHANGED_FILES" | awk '{print "• `" $0 "`"}')
          else
            FILE_LIST="• `no file info`"
          fi

          PAYLOAD=$(jq -n \
            --arg actor "$ACTOR" \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg ci "$CI_STATUS" \
            --arg link "$LINK" \
            --arg file_list "$FILE_LIST" \
            --argjson epoch "$EPOCH" \
            --arg embed_title "$EMBED_TITLE" \
            '{
              content: "",
              embeds: [
                {
                  title: $embed_title,
                  url: $link,
                  color: 5814783,
                  fields: [
                    {
                      name: "👤 Author",
                      value: $actor,
                      inline: true
                    },
                    {
                      name: "🕐 Time",
                      value: ("<t:" + ($epoch | tostring) + ":R>"),
                      inline: true
                    },
                    {
                      name: "📝 Title",
                      value: ("```" + $title + "```"),
                      inline: false
                    },
                    {
                      name: "📖 Extended Description",
                      value: ("```" + $description + "```"),
                      inline: false
                    },
                    {
                      name: "🟢 CI Status",
                      value: $ci,
                      inline: false
                    },
                    {
                      name: "📂 Changed Files",
                      value: $file_list,
                      inline: false
                    }
                  ],
                  footer: {
                    text: "transcendence"
                  }
                }
              ]
            }')

          curl -fsS \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"