services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: transcendence-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      TRANSCENDENCE_APP_PASSWORD: ${TRANSCENDENCE_APP_PASSWORD:?APP password is required}
      TRANSCENDENCE_MIGRATOR_PASSWORD: ${TRANSCENDENCE_MIGRATOR_PASSWORD:?MIGRATOR password is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgresql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: 
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10


  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev

    environment:
      DATABASE_URL: ${DATABASE_URL_MIGRATOR_DOCKER:?MIGRATOR URL is required}

    # 先由 dev-entrypoint 同步 workspace dependencies，
    # 再执行 Prisma generate + migrate。
    command:
      - /app/docker/dev-entrypoint.sh
      - sh
      - -c
      - |
        pnpm --dir apps/api exec prisma generate &&
        pnpm --dir apps/api exec prisma migrate deploy

    depends_on:
      postgres:
        condition: service_healthy

    restart: 'no'

    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules


  seed:
    build:
      context: .
      dockerfile: Dockerfile.dev

    environment:
      DATABASE_URL: ${DATABASE_URL_APP_DOCKER:?APP URL is required}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL is required}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:?SEED_ADMIN_USERNAME is required}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}

    command:
      - /app/docker/dev-entrypoint.sh
      - sh
      - -c
      - pnpm --dir apps/api exec prisma db seed

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: 'no'

    profiles:
      - seed

    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules


  api:
    build:
      context: .
      dockerfile: Dockerfile.dev

    # 不要指定 user。
    # Docker / rootless Podman 使用各自默认的容器用户映射。

    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      WEB_ORIGIN: ${WEB_ORIGIN}

      NODE_ENV: development
      PORT: 3000

      DATABASE_URL: ${DATABASE_URL_APP_DOCKER:?APP URL is required}

      JWT_SECRET: ${JWT_SECRET}
      GENERATE_PRISMA: 'true'

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_SECURE: ${MAIL_SECURE}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}

      APP_BASE_URL: ${APP_BASE_URL:-https://localhost:8443}

    command:
      - /app/docker/dev-entrypoint.sh
      - pnpm
      - --filter
      - api
      - dev

    depends_on:
      migrate:
        condition: service_completed_successfully

    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - upload_data:/app/apps/api/uploads


  web:
    build:
      context: .
      dockerfile: Dockerfile.dev

    command:
      - /app/docker/dev-entrypoint.sh
      - pnpm
      - --filter
      - web
      - exec
      - vite
      - --host
      - 0.0.0.0

    depends_on:
      api:
        condition: service_started

    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules


  nginx:
    image: docker.io/library/nginx:1.27-alpine
    container_name: transcendence-nginx

    security_opt:
      - no-new-privileges:true
  
    ports:
      - '8080:80'
      - '8443:443'

    depends_on:
      - web
      - api

    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro


volumes:
  postgres_data:
  upload_data:

  # pnpm workspace dependencies
  root_node_modules:
  api_node_modules:
  web_node_modules:
