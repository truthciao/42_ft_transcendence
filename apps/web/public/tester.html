<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Chat API Tester</title>
<style>
  body {
    font-family: -apple-system, "Microsoft YaHei", Arial, sans-serif;
    background: #f0f2f5;
    margin: 0;
    padding: 20px;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    padding: 20px;
  }
  h2 {
    margin-top: 0;
  }
  .form-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .form-row label {
    font-size: 13px;
    color: #555;
    display: block;
    margin-bottom: 4px;
  }
  .form-group {
    flex: 1;
    min-width: 180px;
  }
  input, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
    font-size: 14px;
  }
  button {
    padding: 9px 20px;
    background: #07c160;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover {
    background: #06ad56;
  }
  .toolbar {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    margin-bottom: 15px;
  }
  #status {
    margin: 10px 0;
    font-size: 13px;
    color: #999;
  }
  #status.error {
    color: #e64340;
  }
  .chat-box {
    background: #ebebeb;
    border-radius: 6px;
    padding: 15px;
    min-height: 200px;
    max-height: 500px;
    overflow-y: auto;
  }
  .msg {
    display: flex;
    margin-bottom: 14px;
  }
  .msg .bubble-wrap {
    max-width: 70%;
  }
  .msg .meta {
    font-size: 12px;
    color: #888;
    margin-bottom: 4px;
  }
  .msg .bubble {
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-wrap;
  }
  /* 默认（对方消息）：左对齐 */
  .msg.left {
    justify-content: flex-start;
  }
  .msg.left .bubble {
    background: #fff;
    color: #333;
  }
  /* 自己发送的消息：右对齐，可通过设置"我的用户ID"来判断 */
  .msg.right {
    justify-content: flex-end;
  }
  .msg.right .bubble-wrap {
    text-align: right;
  }
  .msg.right .bubble {
    background: #95ec69;
    color: #000;
    text-align: left;
    display: inline-block;
  }
  details {
    margin-top: 15px;
  }
  summary {
    cursor: pointer;
    color: #07c160;
    font-size: 13px;
  }
  pre {
    background: #1e1e1e;
    color: #d4d4d4;
    padding: 12px;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 12px;
    max-height: 300px;
  }
</style>
</head>
<body>

<div class="container">
  <h2>Chat API Tester</h2>

  <div class="form-row">
    <div class="form-group">
      <label>Base URL</label>
      <input id="baseUrl" value="http://localhost:3000" />
    </div>
    <div class="form-group">
      <label>Conversation ID</label>
      <input id="convId" value="1" />
    </div>
    <div class="form-group">
      <label>我的用户ID (用于气泡左右对齐，可留空)</label>
      <input id="myId" value="1" />
    </div>
  </div>

  <div class="form-row">
    <div class="form-group" style="flex: 3;">
      <label>Authorization Token (不含 "Bearer " 前缀)</label>
      <input id="token" placeholder="粘贴 $TOKEN_A 的值" />
    </div>
  </div>

  <div class="toolbar">
    <button onclick="fetchMessages()">获取消息</button>
    <span id="status"></span>
  </div>

  <div class="chat-box" id="chatBox">
    <div style="text-align:center; color:#999; font-size:13px;">点击"获取消息"开始</div>
  </div>

  <details>
    <summary>查看原始 JSON</summary>
    <pre id="rawJson">{}</pre>
  </details>
</div>

<script>
async function fetchMessages() {
  const baseUrl = document.getElementById('baseUrl').value.trim().replace(/\/$/, '');
  const convId = document.getElementById('convId').value.trim();
  const token = document.getElementById('token').value.trim();
  const myId = document.getElementById('myId').value.trim();
  const statusEl = document.getElementById('status');
  const chatBox = document.getElementById('chatBox');
  const rawJson = document.getElementById('rawJson');

  const url = `${baseUrl}/chat/conversations/${convId}/message`;

  statusEl.className = '';
  statusEl.textContent = `请求中: GET ${url} ...`;

  try {
    const res = await fetch(url, {
      method: 'GET',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      }
    });

    const text = await res.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      data = text;
    }

    rawJson.textContent = JSON.stringify(data, null, 2);

    if (!res.ok) {
      statusEl.className = 'error';
      statusEl.textContent = `请求失败 [${res.status}]: ${data.message || text}`;
      chatBox.innerHTML = `<div style="color:#e64340; text-align:center;">${data.message || '请求出错'} (状态码 ${res.status})</div>`;
      return;
    }

    statusEl.className = '';
    statusEl.textContent = `成功 [${res.status}]，共 ${Array.isArray(data) ? data.length : 0} 条消息`;

    renderMessages(Array.isArray(data) ? data : [], myId);

  } catch (err) {
    statusEl.className = 'error';
    statusEl.textContent = '网络请求出错: ' + err.message;
    chatBox.innerHTML = `<div style="color:#e64340; text-align:center;">网络请求出错: ${err.message}</div>`;
  }
}

function renderMessages(messages, myId) {
  const chatBox = document.getElementById('chatBox');
  if (!messages.length) {
    chatBox.innerHTML = '<div style="text-align:center; color:#999;">暂无消息</div>';
    return;
  }

  chatBox.innerHTML = messages.map(m => {
    const isMine = myId !== '' && String(m.senderId) === String(myId);
    const time = m.createdAt ? new Date(m.createdAt).toLocaleString() : '';
    const senderName = m.sender && m.sender.username ? m.sender.username : `用户${m.senderId}`;
    const content = escapeHtml(m.content ?? '');

    return `
      <div class="msg ${isMine ? 'right' : 'left'}">
        <div class="bubble-wrap">
          <div class="meta">${senderName} · ${time}</div>
          <div class="bubble">${content}</div>
        </div>
      </div>
    `;
  }).join('');

  chatBox.scrollTop = chatBox.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.innerText = str;
  return div.innerHTML;
}
</script>

</body>
</html>
