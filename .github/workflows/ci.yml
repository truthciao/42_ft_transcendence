name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/devhub_ci
  JWT_SECRET: ci-only-jwt-secret
  JWT_EXPIRES_IN: 1h
  GOOGLE_CLIENT_ID: test-client-id
  GOOGLE_CLIENT_SECRET: test-client-secret
  GOOGLE_CALLBACK_URL: http://localhost:8443/auth/google/callback
  # This CI uses dummy SMTP credentials; unit tests should mock delivery.
  MAIL_PASS: ci-only-mail-password

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare CI secret files
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secret_dir="${RUNNER_TEMP}/tsds-ci-secrets"
          mkdir -p "$secret_dir"
          chmod 700 "$secret_dir"

          printf '%s' "$DATABASE_URL" > "$secret_dir/database_url_app.txt"
          printf '%s' "$DATABASE_URL" > "$secret_dir/database_url_migrator.txt"
          printf '%s' "$JWT_SECRET" > "$secret_dir/jwt_secret.txt"
          printf '%s' "$GOOGLE_CLIENT_SECRET" > "$secret_dir/google_client_secret.txt"
          printf '%s' "$MAIL_PASS" > "$secret_dir/mail_pass.txt"

          {
            echo "DATABASE_URL_SECRET_FILE=$secret_dir/database_url_app.txt"
            echo "JWT_SECRET_FILE=$secret_dir/jwt_secret.txt"
            echo "GOOGLE_CLIENT_SECRET_FILE=$secret_dir/google_client_secret.txt"
            echo "MAIL_PASS_FILE=$secret_dir/mail_pass.txt"
          } >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Show tool versions
        run: |
          node --version
          pnpm --version
          pnpm config get registry

      - name: Configure pnpm network
        run: |
          pnpm config set fetch-timeout 600000
          pnpm config set fetch-retries 5
          pnpm config set fetch-retry-factor 2
          pnpm config set fetch-retry-mintimeout 10000
          pnpm config set fetch-retry-maxtimeout 120000
          pnpm config set network-concurrency 8

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2; do
            echo "pnpm install attempt ${attempt}/2"

            if pnpm install --frozen-lockfile --reporter=append-only; then
              echo "Dependencies installed successfully"
              break
            fi

            if [ "$attempt" -eq 2 ]; then
              echo "pnpm install failed after 2 attempts"
              exit 1
            fi

            echo "Install failed; retrying..."
            sleep 15
          done

        shell: bash
        run: |
          for attempt in 1 2; do
            echo "pnpm install attempt ${attempt}/2"

            if pnpm install --frozen-lockfile --reporter=append-only; then